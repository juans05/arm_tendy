services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: arm
      POSTGRES_PASSWORD: arm
      POSTGRES_DB: arm
    ports: ["5434:5432"]
    volumes:
      - armdb:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
  redis:
    image: redis:7
    ports: ["6380:6379"]
volumes:
  armdb:
