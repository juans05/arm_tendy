name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: arm
          POSTGRES_PASSWORD: arm
          POSTGRES_DB: arm_test
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U arm" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgres://arm:arm@localhost:5434/arm_test
      DATABASE_URL_TEST: postgres://arm:arm@localhost:5434/arm_test
      FIELD_ENCRYPTION_KEY: clave-solo-para-ci
      META_APP_SECRET: secreto-ci
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: verificar-ci
      CUENTAS_URL: http://localhost:3001
      CUENTAS_ISSUER: https://wsp-sms-api.initchange.dev
      CUENTAS_AUDIENCE: https://wsp-sms.initchange.dev
      BARRIDO: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx eslint "{src,test}/**/*.ts"
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:e2e

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx eslint src
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
